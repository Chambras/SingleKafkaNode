---
kafka_user: kafkaAdmin
kafka_version: "2.3.0"
kafka_scala_version: "2.12"
kafka_java_package: java-11-openjdk-devel
kafka_install_dir: /opt
kafka_home: /opt/kafka
kafka_package: "kafka_{{ kafka_scala_version }}-{{ kafka_version }}"
kafka_archive: "{{ kafka_install_dir }}/{{ kafka_package }}.tgz"
kafka_download_url: "https://archive.apache.org/dist/kafka/{{ kafka_version }}/{{ kafka_package }}.tgz"

